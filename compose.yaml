services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wellness
      POSTGRES_USER: wellness
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - wellness_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellness -d wellness"]
      interval: 5s
      retries: 10
volumes:
  wellness_pg:
